name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip build-essential ccache cmake autoconf automake libtool \
            libltdl-dev pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools<70" wheel virtualenv cython==0.29.36 buildozer

      - name: Cache Buildozer downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v3-${{ hashFiles('buildozer.spec') }}

      - name: Build APK
        shell: bash
        run: buildozer android debug 2>&1 | tee build.log

      - name: Show the real error
        if: failure()
        shell: bash
        run: |
          echo "=============== ERROR SUMMARY (paste this) ==============="
          n=$(grep -n "# Command failed" build.log | head -1 | cut -d: -f1)
          if [ -n "$n" ]; then
            start=$(( n > 70 ? n - 70 : 1 ))
            sed -n "${start},$((n+2))p" build.log | cut -c1-300
          else
            tail -n 80 build.log | cut -c1-300
          fi
          echo "=============== END ERROR SUMMARY ==============="

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shortestpath-apk
          path: bin/*.apk