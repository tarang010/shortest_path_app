name: Build Android
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "debug or release"
        required: true
        default: "debug"
        type: choice
        options: [debug, release]
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip build-essential ccache cmake autoconf automake libtool \
            libltdl-dev pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools<70" wheel virtualenv cython==0.29.36 buildozer

      - name: Cache Buildozer downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v4-${{ hashFiles('buildozer.spec') }}

      # Decide the build type: release for tags or when chosen manually, else debug.
      - name: Determine build type
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "release" ] || [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "type=release" >> "$GITHUB_OUTPUT"
          else
            echo "type=debug" >> "$GITHUB_OUTPUT"
          fi

      # Only needed for release: restore the signing keystore from a repo secret.
      - name: Restore keystore (release only)
        if: steps.mode.outputs.type == 'release'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set. Add it (see README) before a release build."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/release.keystore"

      - name: Build debug APK
        if: steps.mode.outputs.type == 'debug'
        shell: bash
        run: buildozer android debug 2>&1 | tee build.log

      - name: Build signed release AAB
        if: steps.mode.outputs.type == 'release'
        shell: bash
        env:
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export P4A_RELEASE_KEYSTORE="$HOME/release.keystore"
          buildozer android release 2>&1 | tee build.log

      - name: Show the real error
        if: failure()
        shell: bash
        run: |
          echo "=============== ERROR SUMMARY (paste this) ==============="
          n=$(grep -n "# Command failed" build.log | head -1 | cut -d: -f1)
          if [ -n "$n" ]; then
            start=$(( n > 70 ? n - 70 : 1 ))
            sed -n "${start},$((n+2))p" build.log | cut -c1-300
          else
            tail -n 80 build.log | cut -c1-300
          fi
          echo "=============== END ERROR SUMMARY ==============="

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tarangnav-${{ steps.mode.outputs.type }}
          path: |
            bin/*.apk
            bin/*.aab
